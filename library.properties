sentence=Georgian (Mkhedruli) UTF-8 text on HD44780 character LCDs and Adafruit_GFX OLED/TFT displays.
paragraph=On-demand CGRAM glyph loading for 16x2/20x4 LCDs (LiquidCrystal, LiquidCrystal_I2C), Georgian GFX fonts for SSD1306/ST7735/ILI9341 and other Adafruit_GFX displays, a UTF-8 Serial line reader and Georgian keyboard-layout transliteration. Fonts live in PROGMEM. Tested to compile on Arduino Uno, Nano and ESP32.
